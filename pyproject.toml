[project]
name = "evidence-atlas"
version = "0.1.0"
description = "Compare text, visual, and hybrid retrieval on ViDoRe V3 HR and show the evidence behind each answer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2",
    "pillow==12.1.1",
    "pyarrow==23.0.1",
    "pypdf==6.7.5",
    "python-dotenv>=1",
    "pyyaml>=6.0",
    "snowballstemmer>=3",
    "uvicorn>=0.34",
]

[project.scripts]
atlas-inspect = "evidence_atlas.data.inspection:main"
atlas-bm25 = "evidence_atlas.retrieval.run_bm25:main"
atlas-dense = "evidence_atlas.retrieval.run_dense:main"
atlas-visual = "evidence_atlas.retrieval.run_visual:main"
atlas-fusion = "evidence_atlas.retrieval.run_fusion:main"
atlas-rerank = "evidence_atlas.retrieval.run_rerank:main"
atlas-grid = "evidence_atlas.demo.grid:main"
atlas-export-pages = "evidence_atlas.demo.pages:main"
atlas-export-static = "evidence_atlas.demo.static:main"
atlas-answers ="evidence_atlas.generation.run_answers:main"
atlas-serve = "evidence_atlas.api.app:main"
atlas-eval = "evidence_atlas.evaluation.report:main"
atlas-smoke = "evidence_atlas.providers.smoke:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
